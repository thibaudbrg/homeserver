services:
  # MariaDB - MySQL Database
  # After starting container for first time dexec and mysqladmin -u root password <password>
  mariadb:
    container_name: mariadb
    hostname: mariadb
    image: linuxserver/mariadb:latest
    # ports: 3306 no longer published (2026-10-11): every client, Authelia included, connects as mariadb:3306 over Docker networks
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_network
      - nextcloud
      - photoprism
    volumes:
      - $DOCKERDIR/appdata/mariadb/data:/config
      - /etc/TZ:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - FILE__MYSQL_ROOT_PASSWORD=/run/secrets/mysql_root_password # LinuxServer reads FILE__ vars: enables the automatic upgrade check at startup
    secrets:
      - mysql_root_password
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # database: update by hand, run mariadb-upgrade after major versions
