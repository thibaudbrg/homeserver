services:
  # Arr French import - every 10 min, imports finished Radarr/Sonarr downloads that the arr refused only because the
  # uploader renamed the files (MULTi/VFF gone from the name), after checking the real audio tracks with ffprobe.
  # The script is scripts/arr-french-import.py; its last run is in this container's log.
  arr-french-import:
    container_name: arr-french-import
    image: alpine:3.21
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      traefik_network:
        ipv4_address: 192.168.90.174 # reaches radarr and sonarr by name
    environment:
      TZ: $TZ
    command: >-
      sh -c "apk add --no-cache python3 ffmpeg tzdata >/dev/null &&
      echo '*/10 * * * * python3 /scripts/arr-french-import.py > /proc/1/fd/1 2>&1' | crontab - &&
      exec crond -f -l 8"
    volumes:
      - $DOCKERDIR/scripts/arr-french-import.py:/scripts/arr-french-import.py:ro
      - $DOCKERDIR/appdata/radarr/config.xml:/radarr/config.xml:ro
      - $DOCKERDIR/appdata/sonarr/config.xml:/sonarr/config.xml:ro
      - $DATADIR/torrents:/data/torrents:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
