services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: always
    # ports: 6333 no longer published, AnythingLLM reaches qdrant over the llm network (192.168.95.163)
    security_opt:
      - no-new-privileges:true
    networks:
      traefik_network:
      llm:
        ipv4_address: 192.168.95.163
    volumes:
      - $DOCKERDIR/appdata/qdrant/storage:/qdrant/storage
      - $DOCKERDIR/appdata/qdrant/snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__API_KEY: $QDRANT_API_KEY # same value as QDRANT_API_KEY in appdata/anythingllm/.env
    labels:
      - "traefik.enable=true"
      # HTTP Routers for the main Qdrant API
      - "traefik.http.routers.qdrant-api-rtr.entrypoints=https"
      - "traefik.http.routers.qdrant-api-rtr.rule=Host(`qdrant.$DOMAINNAME0`)"
      # Middlewares
      - "traefik.http.routers.qdrant-api-rtr.middlewares=chain-authelia@file"
      # HTTP Services
      - "traefik.http.routers.qdrant-api-rtr.service=qdrant-api-svc"
      - "traefik.http.services.qdrant-api-svc.loadbalancer.server.port=6333"
