services:
  # Immich - Photo & video management (phone backup, faces, maps, smart search)
  # Based on the official v3 release compose + rootless example: https://docs.immich.app/install/docker-compose
  # Before updating a major version (v3 -> v4), read the release notes: the postgres image may change.
  # Library: $IMMICHDIR is the master photo library (iCloud kept as second copy): uploads, thumbnails,
  # encoded videos and Immich's own DB dumps.
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:$IMMICH_VERSION
    restart: unless-stopped
    user: "$PUID:$PGID"
    group_add:
      - "937" # videodriver: owner group of /dev/dri/renderD128, needed for QuickSync as non-root
    networks:
      - traefik_network
      - immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    devices:
      - /dev/dri:/dev/dri # QuickSync hardware transcoding (Intel UHD 600), enable it in Administration > Video Transcoding
    depends_on:
      - immich-redis
      - immich-postgres
    volumes:
      - $IMMICHDIR:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: $TZ
      DB_HOSTNAME: immich-postgres
      DB_USERNAME_FILE: /run/secrets/immich_db_username
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME_FILE: /run/secrets/immich_db_name
      REDIS_HOSTNAME: immich-redis
      IMMICH_ALLOW_SETUP: "false" # admin exists: disables public admin sign-up + DB restore endpoints (set true to restore a backup)
    secrets:
      - immich_db_username
      - immich_db_password
      - immich_db_name
    healthcheck:
      disable: false
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-rtr.entrypoints=https"
      - "traefik.http.routers.immich-rtr.rule=Host(`immich.$DOMAINNAME0`)"
      ## Middlewares
      # chain-no-auth (approved by Tibo 2026-10-11): the mobile app can't pass Authelia, Immich's own login protects it
      - "traefik.http.routers.immich-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.immich-rtr.service=immich-svc"
      - "traefik.http.services.immich-svc.loadbalancer.server.port=2283"

  immich-machine-learning:
    # The server reaches it at the default http://immich-machine-learning:3003, keep this service name
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:$IMMICH_VERSION
    restart: unless-stopped
    user: "$PUID:$PGID"
    networks:
      - immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - $DOCKERDIR/appdata/immich/model-cache:/cache
    environment:
      TZ: $TZ
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    restart: unless-stopped
    user: "$PUID:$PGID"
    networks:
      - immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - $DOCKERDIR/appdata/immich/redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # pinned by digest, follows Immich releases

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    user: "$PUID:$PGID"
    networks:
      - immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    shm_size: 128mb
    volumes:
      - $DOCKERDIR/appdata/immich/postgres:/var/lib/postgresql/data # on the SSD, as Immich recommends
    environment:
      POSTGRES_USER_FILE: /run/secrets/immich_db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_DB_FILE: /run/secrets/immich_db_name
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - immich_db_username
      - immich_db_password
      - immich_db_name
    healthcheck:
      disable: false
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # database: pinned by digest, update by hand per Immich release notes
