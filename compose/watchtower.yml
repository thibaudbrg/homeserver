services:
  # WatchTower - Automatic Docker Container Updates
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - socket_proxy
    environment:
      TZ: $TZ
      WATCHTOWER_SCOPE: "none" # only containers without a scope label (scoped stacks run their own watchtower)
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "false"
      WATCHTOWER_SCHEDULE: "0 30 12 * * *" # Everyday at 12:30
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_URL: "telegram://$TGRAM_BOT_TOKEN@telegram?chats=$TGRAM_CHAT_ID" # same bot as Tautulli
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_API_VERSION: "1.40"
    labels:
      - "com.centurylinklabs.watchtower.scope=none"  # only containers without a scope label (scoped stacks run their own watchtower)
