services:
  # Traefik 3 - Reverse Proxy
  traefik:
    container_name: traefik
    image: traefik:3.7.14
    restart: always
    networks:
      - traefik_network
      - socket_proxy
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    command:
      - --api=true
      - --api.dashboard=true
      # - --api.insecure=true

      - --entryPoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entryPoints.https.address=:443
      - --entryPoints.traefik.address=:8080
      - --entrypoints.https.http.tls.options=tls-opts@file
      - --entrypoints.https.http.tls.certresolver=dns-cloudflare
      - --entrypoints.https.http.tls.domains[0].main=$DOMAINNAME0
      - --entrypoints.https.http.tls.domains[0].sans=*.$DOMAINNAME0

      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false

      # Allow these IPs to set the X-Forwarded-* headers - Cloudflare IPs: https://www.cloudflare.com/ips/
      # + 192.168.91.1 (socket_proxy bridge gateway): Synology's Docker hands ports 80/443 to Traefik from there, trusting it keeps the real client IP
      - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,192.168.91.1

      - --log=true
      - --log.level=INFO
      - --accessLog=false
      - --accessLog.filePath=/traefik.log
      - --accessLog.bufferingSize=100
      - --accessLog.filters.statusCodes=400-499

      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375

      # Automatically set Host rule for services
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_network

      - --providers.file.directory=/rules
      - --providers.file.watch=true


      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.propagation.delayBeforeChecks=90
    volumes:
      - $DOCKERDIR/appdata/traefik/rules:/rules
      - $DOCKERDIR/appdata/traefik/acme/acme.json:/acme.json
      - $DOCKERDIR/appdata/traefik/traefik.log:/traefik.log
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_token # scoped token (Zone:Read + DNS:Edit), replaces the global API key
      - HTPASSWD_FILE=/run/secrets/htpasswd
    secrets:
      - cf_token
      - htpasswd
    labels:
      - "traefik.enable=true"
      # HTTP-to-HTTPS redirect is done at entrypoint level (see command): the old HostRegexp catch-all was v2 syntax and never matched in v3
      # HTTP Routers
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.$DOMAINNAME0`)"
      ## Services - API
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      ## Middlewares
      - "traefik.http.routers.traefik-rtr.middlewares=chain-authelia@file"
