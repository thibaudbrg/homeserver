  ygege:
    image: ghcr.io/djerayane/ygege:docker-publish
    container_name: ygege
    restart: unless-stopped
    networks:
      - traefik_network # Prowlarr reaches it as ygege:8715 (port no longer published)
    volumes:
      - $DOCKERDIR/appdata/ygege/config:/config
    environment:
      RELAY_URL: "wss://relay.ygg.gratis"
      LOG_LEVEL: "debug"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8715/health || exit 1"]
      interval: 1m30s
      timeout: 20s
      retries: 3
      start_period: 10s