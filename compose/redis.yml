services:
  # Speeds up Nextcloud by reducing the time spent "looking" for things
  redis:
    container_name: redis
    image: redis:latest
    restart: always
    hostname: redis
    security_opt:
      - no-new-privileges:true
    command: [
      "redis-server",
      "--bind", "0.0.0.0",
      "--appendonly", "yes",
      "--requirepass", "$REDIS_PASSWORD",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    networks:
      - redis
    # ports: no longer published (2026-10-11), reached through Traefik or by container name
    volumes:
      - $DOCKERDIR/appdata/redis/data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # database: update by hand
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
